name: Validate Source

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 校验 fnpack.json
        run: python scripts/validate.py

      - name: 检查 size / sha256 是否已回填
        run: python scripts/sync_meta.py --check
